<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyVault · 个人知识库</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">S</div><div><strong>StudyVault</strong><span>个人知识库</span></div></div>
        <div class="workspace-switch"><span class="avatar">林</span><span class="workspace-name">林同学的空间</span><span class="chevron">⌄</span></div>
        <button class="new-note" id="newNoteBtn"><span>＋</span> 新建笔记 <kbd>N</kbd></button>
        <nav class="main-nav">
          <a class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>总览 <span class="nav-count">⌘</span></a>
          <a class="nav-item" data-view="notes"><span class="nav-icon">▤</span>全部笔记 <span class="nav-count">12</span></a>
          <a class="nav-item" data-view="favorites"><span class="nav-icon">☆</span>我的收藏 <span class="nav-count">4</span></a>
          <a class="nav-item" data-view="trash"><span class="nav-icon">♧</span>回收站 <span class="nav-count">2</span></a>
        </nav>
        <div class="nav-section"><div class="section-label">标签 <button id="addTagBtn">＋</button></div><div id="tagList" class="tag-list"></div></div>
        <div class="sidebar-bottom"><a class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>设置</a><div class="sync-status"><span class="pulse"></span> 已自动保存 <span class="sync-time">刚刚</span></div></div>
      </aside>

      <main class="main-content">
        <header class="topbar"><div class="breadcrumbs"><span id="pageKicker">你的学习空间</span><span>/</span><strong id="pageTitle">总览</strong></div><div class="top-actions"><button class="icon-btn" title="快捷键" id="shortcutBtn">⌘</button><button class="icon-btn" title="通知">♢<i></i></button><div class="top-avatar">林</div></div></header>
        <div id="pageContent" class="page-content"></div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <div id="modal" class="modal-backdrop"><div class="modal"><div class="modal-head"><h3 id="modalTitle">新建标签</h3><button class="icon-btn" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
    <script src="app.js"></script>
  </body>
</html>
