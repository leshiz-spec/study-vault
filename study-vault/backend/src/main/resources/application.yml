spring:
  application:
    name: studyvault
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studyvault}
    username: ${DATABASE_USERNAME:studyvault}
    # Required at runtime; keep credentials outside source control.
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${SERVER_PORT:8080}
