server {
  # HTTP is used locally. In production, add a second server block that
  # listens on 443 with the mounted certificate/key and redirects this block
  # to HTTPS. Keeping proxy headers here makes that transition transparent.
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Actuator is used internally for dependency checks; expose only the
  # deliberately supported /api/health and /api/ready endpoints publicly.
  location /actuator/ {
    return 404;
  }

  # Match /api as well as /api/... so clients get consistent backend routing.
  location = /api {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
