services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyvault}
      POSTGRES_USER: ${POSTGRES_USER:-studyvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyvault}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [internal]
  backend:
    build: ../backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-studyvault}
      DATABASE_USERNAME: ${POSTGRES_USER:-studyvault}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-studyvault}
    depends_on: [postgres]
    networks: [internal]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro", "../frontend:/usr/share/nginx/html:ro"]
    depends_on: [backend]
    networks: [internal]
volumes: { postgres_data: }
networks: { internal: }
